name = "compy"
main = "src/workers/cloudflare/CloudflareWorker.js"
compatibility_date = "2023-10-30"

minify = false

[site]
bucket = "./dist"

[env.dev.vars]
IS_CLOUDFLARE_WORKER = true
APP_NAME = "saloe-cms"
ENV = "dev"

[env.qa.vars]
IS_CLOUDFLARE_WORKER = true
APP_NAME = "saloe-cms"
ENV = "qa"

[env.prod.vars]
IS_CLOUDFLARE_WORKER = true
APP_NAME = "saloe-cms"
ENV = "prod"

